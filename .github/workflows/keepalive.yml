name: keep-alive
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping servicios de Render
        run: |
          for s in gateway auth catalog orders; do
            curl -s -o /dev/null -m 120 -w "$s %{http_code}\n" https://cognia-$s.onrender.com/actuator/health || true
          done
          curl -s -o /dev/null -m 120 -w "productos %{http_code}\n" "https://cognia-gateway.onrender.com/api/productos?tamano=1" || true
